name: Deploy Stremio Web

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Home Server
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          mkdir -p /tmp/stremio-config
          docker compose up -d --build

      - name: Start Cloudflared Tunnels
        run: |
          # Detener y remover cualquier tunel anterior de la Web UI y el Server
          docker stop cloudflared-tunnel || true
          docker rm cloudflared-tunnel || true
          docker stop cloudflared-tunnel-server || true
          docker rm cloudflared-tunnel-server || true
          
          # Levantar el tunel en segundo plano para la Web UI (puerto 8080) con métricas en puerto aleatorio
          docker run -d --name cloudflared-tunnel --network host cloudflare/cloudflared:latest tunnel --url http://localhost:8080 --metrics localhost:0
          
          # Levantar el tunel en segundo plano para el Streaming Server (puerto 11470) con métricas en puerto aleatorio
          docker run -d --name cloudflared-tunnel-server --network host cloudflare/cloudflared:latest tunnel --url http://localhost:11470 --metrics localhost:0
          
          # Esperar a que se asignen los subdominios temporales (máximo 15 segundos)
          URL_WEB=""
          URL_SERVER=""
          for i in {1..15}; do
            if [ -z "$URL_WEB" ]; then
              URL_WEB=$(docker logs cloudflared-tunnel 2>&1 | grep -o 'https://.*\.trycloudflare\.com' | head -n 1)
            fi
            if [ -z "$URL_SERVER" ]; then
              URL_SERVER=$(docker logs cloudflared-tunnel-server 2>&1 | grep -o 'https://.*\.trycloudflare\.com' | head -n 1)
            fi
            if [ ! -z "$URL_WEB" ] && [ ! -z "$URL_SERVER" ]; then
              break
            fi
            sleep 1
          done
          
          # Guardar la URL del servidor para que el contenedor web pueda consumirla e inyectarla
          if [ ! -z "$URL_SERVER" ]; then
            echo "$URL_SERVER" > /tmp/stremio-config/stremio-server-url.txt
          fi
          
          echo "=========================================================="
          echo "         TUNELES TEMPORALES DE CLOUDFLARE LISTOS"
          echo "=========================================================="
          if [ ! -z "$URL_WEB" ]; then
            echo "Stremio Web UI: $URL_WEB"
          else
            echo "Error iniciando el túnel de Stremio Web UI. Logs:"
            docker logs cloudflared-tunnel | tail -n 20
          fi
          if [ ! -z "$URL_SERVER" ]; then
            echo "Stremio Streaming Server (HTTPS): $URL_SERVER"
            echo "Copie esta URL en Ajustes -> Streaming en Stremio Web"
          else
            echo "Error iniciando el túnel del Servidor de Streaming. Logs:"
            docker logs cloudflared-tunnel-server | tail -n 20
          fi
          echo "=========================================================="
