name: Deploy Stremio Web

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Home Server
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build

      - name: Start Cloudflared Tunnel
        run: |
          # Detener y remover cualquier tunel anterior
          docker stop cloudflared-tunnel || true
          docker rm cloudflared-tunnel || true
          
          # Levantar el tunel en segundo plano apuntando al puerto 8080 del host
          docker run -d --name cloudflared-tunnel --network host cloudflare/cloudflared:latest tunnel --url http://localhost:8080
          
          # Esperar a que se asigne el subdominio temporal (máximo 15 segundos)
          URL=""
          for i in {1..15}; do
            URL=$(docker logs cloudflared-tunnel 2>&1 | grep -o 'https://.*\.trycloudflare\.com' | head -n 1)
            if [ ! -z "$URL" ]; then
              break
            fi
            sleep 1
          done
          
          echo "=========================================================="
          echo "         SU TUNEL TEMPORAL DE CLOUDFLARE ESTA LISTO"
          echo "=========================================================="
          if [ ! -z "$URL" ]; then
            echo "$URL"
          else
            docker logs cloudflared-tunnel
          fi
          echo "=========================================================="
